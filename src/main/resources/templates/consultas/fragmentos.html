<!-- fragmento 1 para mostrar las categorias como chips (según el prototipo) -->
<section th:fragment="tabs" class="py-3 mb-2">
    <div class="d-flex justify-content-center flex-wrap gap-2 px-4">
        <a th:href="@{/}" class="chip"
           th:classappend="${categoriaSel == null} ? 'active'">[[#{pruebas.todas}]]</a>
        <a th:each="c : ${categorias}"
           th:href="@{/consultas/{id}(id=${c.idCategoria})}"
           class="chip"
           th:classappend="${categoriaSel == c.idCategoria} ? 'active'">
            [[${c.descripcion}]]
        </a>
    </div>
</section>

<!-- fragmento 2 para el listado de productos en tarjetas -->
<section th:fragment="tarjetas" class="container py-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <div th:each="p : ${productos}" class="col">
            <div class="card h-100 producto-card">
                <div class="position-relative">
                    <div class="d-flex justify-content-center align-items-center bg-white p-3"
                         style="height: 200px; border-radius: 1.15rem 1.15rem 0 0;">
                        <img th:src="${p.rutaImagen}" class="img-fluid"
                             th:alt="${p.descripcion}"
                             style="max-height: 100%; object-fit: contain;"/>
                    </div>
                    <!-- Corazón de favoritos (HU-12) -->
                    <form th:action="@{/favoritos/alternar}" method="post"
                          class="position-absolute top-0 end-0 m-2">
                        <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                        <input type="hidden" name="origen" value="/"/>
                        <button type="submit" class="fav-heart"
                                th:classappend="${idsFavoritos != null and idsFavoritos.contains(p.idProducto)} ? 'activo' : ''"
                                title="Agregar a favoritos">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </form>
                </div>
                <div class="card-body d-flex flex-column pt-2">
                    <span class="badge badge-cat align-self-start mb-2" th:if="${p.categoria != null}">
                        [[${p.categoria.descripcion}]]</span>
                    <h5 class="card-title text-truncate mb-1">[[${p.descripcion}]]</h5>
                    <p class="card-text text-muted small mb-auto text-truncate">[[${p.detalle}]]</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="precio">[[${#numbers.formatCurrency(p.precio)}]]</span>
                        <span th:if="${p.existencias>0}" class="badge badge-cat">[[${p.existencias}]] unidades</span>
                        <span th:unless="${p.existencias>0}" class="badge text-bg-danger">agotado!</span>
                    </div>
                    <form th:action="@{/carrito/agregar}" th:method="POST" class="d-grid mt-3">
                        <input type="hidden" th:value="${p.idProducto}" name="idProducto"/>
                        <button type="button"
                                class="btn btn-success btn-sm py-2"
                                th:disabled="${p.existencias == 0}"
                                onclick="addCart(this.form)">
                            <i class="fas fa-cart-plus"></i> [[#{accion.anadir}]]
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

</section>
