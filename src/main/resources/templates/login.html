<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <section class="container py-5">
            <div class="row justify-content-center g-4">
                <!-- Inicia Sesión -->
                <div class="col-md-5">
                    <div class="card h-100">
                        <div class="card-body p-4">
                            <h3 class="font-serif">[[#{plantilla.iniciarSesion}]]</h3>
                            <p class="text-muted small">[[#{login.bienvenida}]]</p>
                            <form th:action="@{/login}" method="post" class="was-validated mt-4">
                                <div class="mb-3">
                                    <label for="username">[[#{login.username}]]</label>
                                    <input type="text" class="form-control" name="username" id="username" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label for="password">[[#{login.password}]]</label>
                                        <a th:href="@{/olvide-password}" class="small">[[#{recuperacion.olvidasteContrasena}]]</a>
                                    </div>
                                    <input type="password" class="form-control" name="password" id="password" required="true"/>
                                </div>
                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-success py-2">[[#{login.login}]]</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Crea una Cuenta -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body p-4">
                            <h3 class="font-serif">[[#{registro.titulo}]]</h3>
                            <p class="text-muted small">[[#{registro.subtitulo}]]</p>
                            <form th:action="@{/registro/guardar}" method="post" class="was-validated mt-4">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label>[[#{usuario.nombre}]]</label>
                                        <input type="text" class="form-control" name="nombre" maxlength="20" required="true"/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label>[[#{usuario.apellidos}]]</label>
                                        <input type="text" class="form-control" name="apellidos" maxlength="30" required="true"/>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label>[[#{usuario.correo}]]</label>
                                    <input type="email" class="form-control" name="correo" maxlength="75" required="true"/>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label>[[#{usuario.username}]]</label>
                                        <input type="text" class="form-control" name="username" maxlength="30" required="true"/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label>[[#{usuario.password}]]</label>
                                        <input type="password" class="form-control" name="password" minlength="8" required="true"/>
                                    </div>
                                </div>
                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-outline-verde py-2">[[#{registro.titulo}]]</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted small fst-italic mt-5">"[[#{plantilla.suTienda}]]"</p>
        </section>
        <section th:replace="~{general/fragmentos :: mostrarToast}"/>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
