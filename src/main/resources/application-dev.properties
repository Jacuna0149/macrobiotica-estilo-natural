# Perfil "dev" (solo local): ejecuta la app con H2 en memoria, sin MySQL.
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# El esquema se autocrea desde las entidades y los datos de ejemplo salen de data.sql.
spring.datasource.url=jdbc:h2:mem:macrobiotica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

server.port=8080
